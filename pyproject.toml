[project]
name = "ngs360-server"
version = "0.1.0"
description = "NGS360 API Server"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "authlib>=1.7.2",
    "bcrypt>=5.0.0,<6.0.0",
    "boto3>=1.43.72",
    "cryptography>=50.0.0",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.141.1",
    "gunicorn>=26.0.0",
    "httpx>=0.27.0",
    "langgraph-sdk>=0.2.9",
    "mako>=1.4.1",
    "opensearch-py>=3.2.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyjwt==2.15.1",
    "pymysql>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "pytz>=2026.3.post1",
    "sample-sheet>=0.13.0",
    "smart-open>=8.0.1",
    "ldap3>=2.9.1",
    "sqlmodel>=0.0.39",
    "uvicorn>=0.52.3",
]

[project.optional-dependencies]
dev = [
    "flake8",
    "pytest",
    "pytest-cov"
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mock>=5.2.0",
    "pytest>=8.4.1",
    "pytest-cov>=7.1.0",
]
