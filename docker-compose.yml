services:
  frontend:
    container_name: frontend
    networks:
      - ngs360-network
    build:
      context: ../frontend-ui
      dockerfile: Dockerfile
    ports:
      - 8080:8080
    environment:
      - VITE_API_URL=http://localhost:3000/
    volumes: # this allows live reloading of the frontend code
      - ../frontend-ui:/app
      - /app/node_modules

  apiserver:
    container_name: apiserver
    networks:
      - ngs360-network
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
        restart: true
      opensearch:
        condition: service_healthy
        restart: true
    ports:
      - "3000:3000"
    environment:
      # Bind to all interfaces inside the container so Docker's port mapping works
      - API_HOST=0.0.0.0
      # Local compose keeps the historical 3000 mapping (image default is 5000)
      - API_PORT=3000
      - client_origin=http://localhost:8080
      # Database variables
      - SQLALCHEMY_DATABASE_URI=mysql+pymysql://root:rootpassword@db:3306/ngs360
      # Open search
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - OPENSEARCH_USE_SSL=false
      - OPENSEARCH_VERIFY_CERTS=false
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-admin}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-admin}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - DEMUX_WORKFLOW_CONFIGS_BUCKET_URI=${DEMUX_WORKFLOW_CONFIGS_BUCKET_URI:-s3://my-tool-configs-bucket/}
      - OAUTH_GOOGLE_CLIENT_ID=${OAUTH_GOOGLE_CLIENT_ID:-test}
      - OAUTH_GOOGLE_CLIENT_SECRET=${OAUTH_GOOGLE_CLIENT_SECRET:-test}
      - OAUTH_GITHUB_CLIENT_ID=${OAUTH_GITHUB_CLIENT_ID:-test}
      - OAUTH_GITHUB_CLIENT_SECRET=${OAUTH_GITHUB_CLIENT_SECRET:-test}
      # AI Assistant Chat (deployed NGS360 LLM Agent on the LangGraph Platform).
      # Supply LANGSMITH_API_KEY and LANGGRAPH_DEPLOYMENT_URL via a host .env
      # file (see .env.example); chat endpoints are disabled when either is
      # unset. The assistant id defaults to the graph name.
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY}
      - LANGGRAPH_DEPLOYMENT_URL=${LANGGRAPH_DEPLOYMENT_URL}
      - LANGSMITH_ASSISTANT_ID=${LANGSMITH_ASSISTANT_ID:-ngs360_agent}
    volumes: # this allows live reloading of the backend code
      - ${PWD}:/app
      - /app/.venv  # isolate container venv from host
 
  opensearch:
    image: opensearchproject/opensearch:2.19.3
    cap_add:
      - IPC_LOCK
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "discovery.type=single-node"
      - "plugins.security.disabled=true"
      - "OPENSEARCH_INITIAL_ADMIN_PASSWORD=0penSearch!"
    healthcheck:
      # Single-node clusters sit at "yellow" once indices exist (replicas can't be
      # assigned), so accept yellow or green.
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 3s
      retries: 5
      start_period: 30s
      timeout: 10s
    networks:
      - ngs360-network
    ports:
      - 9200:9200
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data

  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ngs360
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    networks:
      - ngs360-network
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    platform: linux/amd64
    container_name: phpmyadmin
    restart: always
    networks:
      - ngs360-network
    ports:
      - "8085:80"
    environment:
      - PMA_HOST=db
      - MYSQL_ROOT_PASSWORD=rootpassword
    depends_on:
      - db

volumes:
  db_data:
    # Uncomment the following lines to use a specific location on the host for the volume
    # If not specified, Docker will manage the volume location automatically
    #driver: local
    #driver_opts:
    #  type: none
    #  device: ./mysql-data
    #  o: bind
  opensearch_data:
    # Uncomment the following lines to use a specific location on the host for the volume
    # If not specified, Docker will manage the volume location automatically
    #driver: local
    #driver_opts:
    #  type: none
    #  device: ./opensearch-data
    #  o: bind

networks:
  ngs360-network:
    external: true
